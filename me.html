<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Командний режим · Roddi Health</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=blue1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Onest,system-ui,sans-serif;color:#0f0f11;background:linear-gradient(180deg,#d8e5f6 0%,#e9f0f8 55%,#fff8ee 100%)}
    main{max-width:440px;text-align:center}
    h1{margin:0 0 10px;font-size:clamp(28px,6vw,38px);line-height:1.1;letter-spacing:-.03em;font-weight:600}
    p{margin:0 0 26px;font-size:16px;line-height:1.5;color:#404955}
    .state{display:inline-block;margin-bottom:18px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;background:#fff;box-shadow:inset 0 0 0 1px #d9dce1}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    button,a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border:0;border-radius:999px;font:500 15px Onest,system-ui,sans-serif;text-decoration:none;cursor:pointer;background:#0f0f11;color:#fff}
    .alt{background:#fff;color:#0f0f11;box-shadow:inset 0 0 0 1px #d9dce1}
    :focus-visible{outline:2px solid #3172c8;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <span class="state" id="state" role="status">…</span>
    <h1>Командний режим</h1>
    <p id="msg">Для Уляни й Вероніки. Коли режим увімкнений, цей браузер не потрапляє в Clarity і не показує банер cookies. Налаштування діє лише в цьому браузері й на цьому пристрої.</p>
    <div class="row"><button id="toggle" type="button"></button><a class="alt" href="/">На сайт</a></div>
  </main>
  <script>
    var KEY = 'roddi:internal';
    function on() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
    function set(v) { try { if (v) localStorage.setItem(KEY, '1'); else localStorage.removeItem(KEY); } catch (e) { msg.textContent = 'Браузер не дозволяє зберігати налаштування (приватне вікно?). Спробуйте звичайне вікно.'; } }
    function paint() {
      state.textContent = on() ? 'Увімкнено: вас не рахує аналітика' : 'Вимкнено: ви рахуєтесь як відвідувач';
      toggle.textContent = on() ? 'Вимкнути командний режим' : 'Увімкнути командний режим';
    }
    // Opening /me turns the mode on the first time; the button then switches it either way.
    if (!on() && !sessionStorage.getItem('roddi:me-seen')) { set(true); }
    try { sessionStorage.setItem('roddi:me-seen', '1'); } catch (e) {}
    toggle.addEventListener('click', function () { set(!on()); paint(); });
    paint();
  </script>
</body>
</html>
