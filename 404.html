<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено · Roddi Health</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Onest,system-ui,sans-serif;color:#0f0f11;background:linear-gradient(180deg,#efdfe9 0%,#f6ebe9 55%,#fff8ee 100%)}
    main{max-width:460px;text-align:center}
    img.logo{height:44px;margin-bottom:36px}
    h1{margin:0 0 12px;font-size:clamp(34px,8vw,48px);line-height:1.05;letter-spacing:-.03em;font-weight:600}
    p{margin:0 0 28px;font-size:17px;line-height:1.5;color:#4b4550}
    .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;background:#0f0f11;color:#fff}
    a.alt{background:#fff;color:#0f0f11;box-shadow:inset 0 0 0 1px #d9dce1}
    a:focus-visible{outline:2px solid #a45588;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo-black.svg" alt="Roddi Health">
    <h1 id="t">Такої сторінки немає</h1>
    <p id="d">Можливо, посилання застаріло. Поверніться на головну або загляньте в блог.</p>
    <div class="row"><a id="h" href="/">На головну</a><a id="b" class="alt" href="/blog">Блог</a></div>
  </main>
  <script>
    // The same file serves every missing address, so pick the language from the path.
    if (location.pathname.indexOf('/en') === 0) {
      document.documentElement.lang = 'en';
      document.title = 'Page not found · Roddi Health';
      t.textContent = 'This page does not exist';
      d.textContent = 'The link may be outdated. Go back home or have a look at the blog.';
      h.textContent = 'Home'; h.href = '/en/index.html';
      b.textContent = 'Blog'; b.href = '/en/blog.html';
    }
  </script>
</body>
</html>
